name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mod:
    name: mod (Claude Code ${{ matrix.claude }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 2.1.316 is the version the mod is built and tested on: the gate.
        # latest asks whether it still loads in what people run; the mod API is
        # early access and moves between releases, so a failure there is a
        # warning to act on, not a block on merging.
        claude: ['2.1.316', 'latest']
    continue-on-error: ${{ matrix.claude == 'latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      # No credentials: validate reads the files off disk, and the tests run
      # against the engine's own kit.
      - run: |
          claude plugin validate .
          claude plugin validate plugins/quest-hud
          claude plugin test plugins/quest-hud

  status-line:
    name: status-line script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest ships jq and shellcheck.
      - run: bash plugins/quest-hud/tests/hud-line.sh
      - run: shellcheck --severity=warning plugins/quest-hud/scripts/*.sh plugins/quest-hud/tests/*.sh

  source-text:
    name: no bidirectional control characters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Trojan Source: a literal bidi override makes code read differently from
      # what it does. Write such characters as escapes, never literally.
      - run: |
          if git ls-files -z | xargs -0 perl -CSD -ne 'if (/[\x{200E}\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]/) { print "$ARGV:$.\n"; $found = 1 } close ARGV if eof; END { exit($found ? 1 : 0) }'; then
            echo "none found"
          else
            echo "literal bidirectional control characters above; write them as escapes"
            exit 1
          fi
